<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Trip Sathi Horizon Compass Icon -->
  <g transform="translate(4, 4)">
    <defs>
      <linearGradient id="tsIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#16324F" />
        <stop offset="100%" stop-color="#0F9D91" />
      </linearGradient>
      <linearGradient id="tsPinGrad" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0F9D91" />
        <stop offset="100%" stop-color="#16B8AB" />
      </linearGradient>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="40" height="40" rx="11" fill="url(#tsIconGrad)" />
    <!-- Subtle inner glow ring -->
    <rect x="1.5" y="1.5" width="37" height="37" rx="9.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Stylized Compass / Pin Path -->
    <!-- Horizon curve -->
    <path d="M7 26 C 14 22, 26 22, 33 26" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>
    <!-- Compass Pointer / Location Pin -->
    <path d="M20 9 C 14.5 9, 10 13.5, 10 19 C 10 25.5, 20 33, 20 33 C 20 33, 30 25.5, 30 19 C 30 13.5, 25.5 9, 20 9 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Center teal compass dot / eye -->
    <circle cx="20" cy="18" r="4.2" fill="#0F9D91" />
    <circle cx="20" cy="18" r="1.8" fill="#FFFFFF" />
    <!-- Accent Coral mini star/sparkle at top-right -->
    <circle cx="31" cy="9" r="2.2" fill="#FF795D" />
  </g>
  <!-- Brand Wordmark -->
  <text x="56" y="30" font-family="'Manrope', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5px">
    <tspan fill="#16324F">Trip </tspan>
    <tspan fill="#0F9D91">Sathi</tspan>
  </text>
  <text x="57" y="41" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#64748B" letter-spacing="1.2px">DISCOVER &bull; PLAN &bull; EXPLORE</text>
</svg>
