<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found · Trip Sathi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(160deg, #084e53 0%, #0b6e75 58%, #0d7f83 100%);
            color: #fff;
            text-align: center;
            padding: 24px;
        }
        .card { max-width: 460px; }
        .logo { width: 116px; height: auto; margin-bottom: 24px; }
        .code {
            font-size: 84px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -3px;
            opacity: 0.9;
        }
        h1 { font-size: 26px; font-weight: 700; margin: 8px 0 12px; }
        p { font-size: 15px; line-height: 1.6; opacity: 0.85; margin-bottom: 28px; }
        a {
            display: inline-block;
            background: #fff;
            color: #0b6e75;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 8px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="/images/logo.png" alt="Trip Sathi">
        <div class="code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you are looking for doesn't exist or has been moved. This preview environment serves static files only &mdash; please deploy to a PHP-capable host for the full Trip Sathi experience.</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
